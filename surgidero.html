                        <a-text value="La presencia de ganado local en las marismas puede generar impactos negativos, especialmente en áreas con escasez de agua. El pastoreo excesivo deteriora la vegetación nativa y altera los ecosistemas acuáticos al compactar el suelo y reducir la capacidad de retención de agua. Esto puede agravar la escasez hídrica, ya que el ganado puede consumir grandes cantidades de agua dulce disponible en la zona. Además, la presión sobre los recursos hídricos limita la regeneración de vegetación clave en las marismas, afectando su capacidad para almacenar carbono y proporcionar hábitats para diversas especies. La gestión adecuada del ganado es esencial para conservar estos ecosistemas." position="0 0.4 0.01" align="center" color="white" width="9.5" text="wrapCount: 48; lineHeight: 50; baseline: top; negate: false; font:./lato-font-main/Lato-Regular-msdf.json; fontImage: ./lato-font-main/Lato-Regular-msdf.png" ></a-text>
