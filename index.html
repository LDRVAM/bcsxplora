<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BCSxplora</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="destination-menu">

        <video
            id="background-video"
            autoplay
            muted
            loop
            playsinline
        ></video>

        <div class="overlay"></div>

        <div class="brand-bar">
            <div class="logo-group">
                <div class="logo-circle"><img src="images/secretaria.png" alt="Logo de la Secretaría"></div>
                <div class="logo-circle"><img src="images/xplora.png" alt="Logo de Xplora"></div>
            </div>

            <h1 class="project-name">BCSxplora</h1>

            <div class="logo-group">
                <div class="logo-circle"><img src="images/uabcs-logo.png" alt="Logo de UABCS"></div>
                <div class="logo-circle"><img src="images/coscyt.png" alt="Logo de COSCYT"></div>
            </div>
        </div>

        <section class="menu-content">
            <span class="location">Explora los paseos</span>
            <div id="destination-grid" class="destination-grid" aria-live="polite"></div>
        </section>

    </main>

    <script src="js/menu.js"></script>

</body>

</html>
